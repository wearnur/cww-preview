<svg class="mark mark-sun" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="256" height="256"><style>svg{--l-ink:#16171b;--l-main:#ffc629;--l-hi:#ffc629;--l-soft:#fffaf0;--l-spark:#fff}
.mark-sun .sun{animation:cw-rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.mark-sun .gleam{animation:cw-gleam 6s ease-in-out 1.1s infinite}
.mark-swipe .swipe{stroke-dasharray:100;stroke-dashoffset:100;animation:cw-draw 1.1s .15s cubic-bezier(.65,.05,.25,1) forwards}
.mark-swipe .drop{opacity:0;animation:cw-pop .5s 1.1s ease-out forwards}
.mark-swipe .d2{animation-delay:1.25s}
.mark-monogram .arc{stroke-dasharray:100;stroke-dashoffset:100;animation:cw-draw 1s .1s cubic-bezier(.65,.05,.25,1) forwards}
.mark-monogram .wline{stroke-dasharray:100;stroke-dashoffset:100;animation:cw-draw .9s .55s cubic-bezier(.65,.05,.25,1) forwards}
.mark-monogram .ref{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:cw-grow .6s cubic-bezier(.2,.8,.2,1) forwards}
.mark-monogram .r1{animation-delay:1.1s}.mark-monogram .r2{animation-delay:1.22s}.mark-monogram .r3{animation-delay:1.34s}
.spark{transform-box:fill-box;transform-origin:center;animation:cw-twinkle 3.6s ease-in-out 1.4s infinite}
@keyframes cw-rise{from{transform:translateY(24px)}to{transform:none}}
@keyframes cw-gleam{0%{transform:translateX(-34px)}22%,100%{transform:translateX(84px)}}
@keyframes cw-draw{to{stroke-dashoffset:0}}
@keyframes cw-pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes cw-grow{to{transform:scaleX(1)}}
@keyframes cw-twinkle{0%,100%{transform:scale(.85) rotate(0)}45%{transform:scale(1.2) rotate(45deg)}60%{transform:scale(.95) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){.mark *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<defs><clipPath id="gs"><rect x="7" y="7" width="50" height="50" rx="13"/></clipPath></defs>
<g clip-path="url(#gs)"><rect x="7" y="7" width="50" height="50" style="fill:var(--l-soft)"/>
<circle class="sun" cx="42" cy="24" r="9.5" style="fill:var(--l-main)"/>
<path class="gleam" d="M-14 64 18 0h9L-5 64Z" fill="#fff" opacity=".7"/></g>
<rect x="7" y="7" width="50" height="50" rx="13" fill="none" style="stroke:var(--l-ink)" stroke-width="5"/>
<path d="M32 9v46M9 32h46" style="stroke:var(--l-ink)" stroke-width="4.2" fill="none"/>
</svg>